# VS Mart backend — local/VPS stack.
# Start lean (api/db/redis/caddy); enable worker/beat/minio as those features land.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    build: .
    restart: unless-stopped
    command: gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    depends_on: [db, redis]
    # expose only to caddy via the internal network (no host port in prod)
    expose: ["8000"]

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: .env
    depends_on: [db, redis]
    profiles: ["jobs"]          # docker compose --profile jobs up

  beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: .env
    depends_on: [db, redis]
    profiles: ["jobs"]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["miniodata:/data"]
    profiles: ["storage"]

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  caddy_data: {}
  caddy_config: {}
