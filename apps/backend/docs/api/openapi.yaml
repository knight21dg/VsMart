        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - addresses
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ''
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
                  meta:
                    type: object
                    nullable: true
                required:
